name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm trusted publishing (OIDC): no npm token anywhere
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      # Trusted publishing needs npm >= 11.5.1 (Node 22's bundled npm is 10).
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/check-client-bundle.mjs
      - run: node scripts/smoke-host.mjs
      - name: Committed lib/ is fresh
        run: test -z "$(git status --porcelain -- lib)"
      - name: Tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      # @refkit/dsh-plugin lists this repo and `release.yml` as its trusted publisher on
      # npmjs.com, so npm exchanges the job's OIDC token here and signs provenance.
      # No registry-url / NODE_AUTH_TOKEN: an `_authToken` in .npmrc would bypass OIDC.
      - run: npm publish --access public
